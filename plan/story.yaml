# 敘事層：每段落發生什麼。只寫劇情與情緒，不寫景別、構圖、顏色等畫面細節（那些寫在 shots.yaml）。
# 角色、場景、物件一律用 @id（定義在 glossary.yaml）。

logline: >
  一股 @silence 正把世界的顏色、聲音與動態抹成灰色定格；CSFCCA 喚醒 AI 救援程式 @luna，
  她和 @drone 必須在倒數歸零前，從 @signal_tower 把整座 @city 重新「播」回來。
theme: 創作讓世界重新動起來；@silence 不會徹底消失，所以創作必須一直繼續。
tone: 冷酷未來感，帶懸疑，最後解決。
ending: 勝利，但留下伏筆（@silence 沒有完全消失）。
status: proposed

beats:
  - id: intro
    section: intro
    bars: [0, 4]
    places: ["@hq_control"]
    story: >
      @hq_control 收到 @city 正被 @silence 吞沒的訊號。@monitor_wall 亮起，畫面一格格變灰。
      @drone 啟動倒數，@pod 裡的 @luna 睜開眼睛。
    emotion: 冷靜、緊繃、蓄勢
    lyric_link: 「訊號亮起、畫面開啟、倒數開始、世界重啟、321」＝控制室收到訊號、出擊倒數
    status: proposed

  - id: hook
    section: hook
    bars: [5, 8]
    places: ["@launch_tunnel", "@launch_roof", "@city"]
    story: >
      倒數歸零，@pod 的底座平台載著 @luna 與 @drone 沿 @launch_tunnel 射上去；@drone 用 @echo_beam 打開 @launch_roof 的艙口，
      平台急停，@luna 順勢躍出艙口、單膝落在樓頂。她穿過的定格雨滴短暫恢復成透明、會落下的水珠（@restore_touch 的第一次預告，她還沒注意到）。
      她第一次看見 @city：近處全被 @silence 吞沒，遠方還有幾區彩色，@signal_tower 就在彩色區裡，灰色邊界正往那裡推進。
    emotion: 爆發、果斷
    lyric_link: 「LIVE AI」＝出擊
    status: confirmed

  - id: verse
    section: verse
    bars: [9, 16]
    places: ["@street"]
    story: >
      @luna 走進 frozen 的 @street。她踩進水窪，水花短暫恢復，她第一次注意到自己的能力（@restore_touch）。
      她用指尖碰了一顆定格的 @balloon，再碰了追著它的 @balloon_child：@balloon 往上飄、@balloon_child 追了兩三步，
      然後兩個一起被 @silence 蓋回灰色。她看著自己的手；抬頭時看見遠方的彩色街區又被吞掉一塊。
      @drone 投影 @tower_hologram，告訴她目標是 @signal_tower；她望向街尾的塔，起步。
    emotion: 好奇→發現自己的能力→意識到不夠
    lyric_link: 「一張空白的畫面…沒有攝影棚、沒有既定劇本…把不可能的畫面變成眼前」＝她在 frozen 的 @city 裡第一次讓東西動起來
    status: confirmed

  - id: prechorus
    section: prechorus
    bars: [17, 20]
    places: ["@street"]
    story: >
      @silence 開始加速擴散。@luna 跳上定格的 @hovercar，一台接一台往 @signal_tower 跑；她每一步都踩出一小塊恢復的世界，
      卻一塊塊被吞回去。用了太多能力，她自己的顏色也開始從髮尾與指尖退掉（@luna_fade）。遠方的彩色街區被快速吞食，
      她從最後一台車往塔縱身一躍。
    emotion: 時間壓力、加速
    lyric_link: 「每一次生成都是新的宇宙／時間正在倒數」
    status: confirmed

  - id: chorus1
    section: chorus1
    bars: [21, 33]
    places: ["@street", "@signal_tower"]
    story: >
      bar 21：@silence 的 surge 與她身上的 @luna_fade 會合，@luna 和 @drone 一起被凍在半空。bar 22：她在灰色中張開雙臂，
      第一次廣播從胸口炸開，@broadcast_wave 恢復了一整個街區——光、全息看板上的影像、雨和路人一起醒來。幾秒後邊界又開始往內吞回；
      跳接到 @signal_tower 塔底，灰色正沿塔身往上爬。她沿外牆的結構肋與維修平台一路蹬跳上去，甩開灰色，
      @drone 用 @echo_beam 打開觀景台的一扇全景窗，她翻進控制室。
    emotion: 窒息→爆發→主動出擊
    lyric_link: 「LIVE AI 現在就創造未來…讓光影、讓聲音、讓故事全部醒來」
    status: confirmed

  - id: bridge
    section: bridge
    bars: [34, 36]
    places: ["@signal_tower"]
    story: >
      @signal_tower 的控制室裡，@luna 一處處動手接回廣播系統，每一個英文動詞是一個動作：Create 拍下主控台、它亮起；
      Make 推上副控台的推桿，機櫃一排排亮起；Show me your world 讓全景窗一片接一片生成 @city 各處恢復後的彩色影像（@window_feed），跟著「world」的每一聲生成一片；
      Dream 她把 @drone 送進主控台中央的插座，讓它當訊號核心；Build 光柱一段段亮上去，@drone 在光柱裡跟著升到頂；
      Let the future unfold 塔外的燈帶一圈接一圈往上亮、天線亮起——系統就緒，但廣播還沒發出。塔外的灰色仍在下方往上爬。
    emotion: 俏皮、亢奮
    lyric_link: 「Create it, Make it, Show me your world, Dream it, Build it, Let the future unfold」＝重建廣播系統
    status: confirmed

  - id: build
    section: build
    bars: [37, 40]
    places: ["@signal_tower"]
    story: >
      系統就緒，@luna 抬頭看著光柱頂端的 @drone 笑了。下一拍 @silence 反撲：灰色暴衝上 @signal_tower，切斷廣播系統，控制室全暗；
      斷電的 @drone 從光柱頂端掉下來，撞到插座彈到地上，落地那一刻被凍成灰色。灰色從窗湧進控制室，只剩她自己的顏色撐住的 @luna_hold。
      她跳上主控台、雙手按住熄滅的光柱，用自己的身體當訊號源倒數「3、2、1」：每數一聲，她的顏色灌進光柱亮起一段，@luna_hold 也縮小一次；
      在「1」的瞬間，@luna_hold 縮到她身上，她也被凍結（bar 38 三拍定格）。接著閃回她一路恢復過的東西——雨滴、水窪、@balloon 與 @balloon_child、@hovercar——全都是灰的；最後回到凍住的她。
    emotion: 冷靜→孤立→決斷
    lyric_link: 「321 LIVE AI 現在就創造未來」＝最後一次廣播的倒數
    status: proposed

  - id: final_chorus
    section: final_chorus
    bars: [41, 49]
    places: ["@signal_tower", "@city"]
    story: >
      顏色從 @luna 體內衝破灰色：從貼著光柱的掌心擴散到她整個身體，表面的灰色被頂開、吹散；她不放手，力量順著光柱上到天線，
      @full_broadcast 從塔頂發出。波掃過控制室，@drone 恢復、飛回她肩旁；波一路擴大，整座 @city 從 frozen 變成 restored，
      回到她走過的 @street，雨與路人重新動起來；看板重新播放電影、音樂、動畫（@billboard_media）。她走出控制室，站上外環走道的矮牆，面對整座城舉起拳頭。
    emotion: 自信、開闊、勝利
    lyric_link: 「讓你的世界被所有人看見…讓電影、讓音樂、讓動畫重新醒來」
    status: proposed

  - id: post_chorus
    section: post_chorus
    bars: [50, 56]
    places: ["@city"]
    story: >
      全城恢復，雨與人群重新移動，塔的燈帶跟著音樂一下下亮；@luna 坐在矮牆上和 @drone 一起笑。bar 53 是恢復的最高點：全城的燈同時亮一下。
      之後快速回顧她走過的地方——和 Build 閃回同樣的四個地方，現在都是彩色。最後地平線開始天亮。
    emotion: 狂喜、慶祝
    lyric_link: 「LIVE AI／讓想像成真／讓未來發生」
    status: proposed

  - id: outro
    section: outro
    bars: [57, 58]
    places: ["@hq_control"]
    story: >
      回到 @hq_control，@monitor_wall 全部恢復彩色，只剩一面螢幕仍是灰色，
      而且灰色正在那面螢幕裡慢慢擴散——伏筆。@luna 看著它，最後回頭直視觀眾。片尾疊 CSFCCA／LIVE AI 字標。
    emotion: 滿足→警覺
    lyric_link: 「CSFCCA LIVE AI」＝CSFCCA 是這個故事裡的組織
    status: proposed
