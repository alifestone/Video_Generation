# P5 prompt 正本（Claude Opus 5.5 撰寫）。tools/p5_shotlist.py 讀這份＋shots.yaml＋timeline.json 產生 shotlist.json。
#
# 慣例（Claude 代決，理由見 plan/review/p5_decisions.yaml）：
# - keyframe.first / last：Illustrious＋LUNA LoRA v2 的 Danbooru tag 全文。有 @luna 的鏡頭以
#   「lunacsf, 1girl, solo, grey eyes, dark purple hair」開頭＋依構圖的服裝 tag（同 tools/p3_lora_gen.prompt_outfit），
#   結尾接 QUALITY。沒有 @luna 的鏡頭用 no humans、不掛 LoRA。
#   正式關鍵幀（P6）照 G0 決定的方法：Qwen-Edit 合成（角色表＋refs/entities）→ Illustrious img2img＋canny → 後製；
#   這裡的 tag 是 img2img 階段與 P5 草圖用的。灰色（frozen）一律後製去飽和，tag 不寫 greyscale/monochrome（會連 LUNA 一起變灰）。
#   後製合成的特效（@countdown_ring、@echo_beam、@broadcast_wave、glow_pulse、@tower_hologram…）不寫進 tag。
# - keyframe.last：只在 variation 為 medium/large 且影片走首尾幀模型時寫。
# - video：Wan2.2 與 H3 共用英文自然語言格式（P4 試作同一份 prompt 兩個模型都可用）：
#   「Anime cel-shaded shot, <景別>, <運鏡>.」＋畫面＋動作（時間用「in the first half / at the end」等相對說法）。
#   只寫 realize 含 model 的部分；後製效果不寫。被凍住的灰色世界寫成 grey, frozen, perfectly still。
# - model：wan_flf（Wan2.2 I2V A14B Q8＋lightx2v 4 步＋首尾幀，16fps）、h3_fl2va（MiniMax H3 FL2VA turbo 8 步，24fps）、
#   parallax（路線 C，tools/p4_parallax.py＋後製）、post_only（靜態關鍵幀＋後製，不進影片模型也不做深度視差）。
#   路線 B 一律先標 wan_flf（首尾幀用 OpenPose＋ControlNet 出姿勢關鍵幀）；Fun Control 待第一個 B 段落前測試（p4_fun_control: deferred）。
# - tier：hero＝該段落的記憶點／劇情轉折，P7 seed 預算加倍（最多 8 次）；其餘 normal（最多 4 次）。

defaults:
  quality: "masterpiece, best quality, anime screencap, clean lineart, cel shading"
  illustrious_negative: >-
    lowres, bad anatomy, bad hands, extra fingers, missing fingers, fused fingers, extra digits, text, watermark, signature, logo,
    letters, username, green eyes, aqua eyes, blue eyes, two thigh straps, thighhighs, kneehighs, jacket, hat, glasses, chibi, 3d,
    realistic, photo, blurry, multiple girls
  video_negative: >-
    text, letters, watermark, subtitles, extra drone, duplicate drone, camera shake, cut, scene change,
    blurry face, deformed hands, extra fingers, color shift, realistic, 3d render

