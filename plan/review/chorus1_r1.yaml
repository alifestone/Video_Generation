round: chorus1_r1
issues:
- {id: Q01, where: shots.s023.subjects.silence, category: 6, severity: medium, status: resolved,
   question: "s022 末幀到 s023 首幀之間，surge 離她的距離是否允許跳變？",
   resolution: "s023 首幀 surge 上緣改在畫面高約 92%、離她身體下緣約 1 m，接近 s022 末幀的相對距離；換鏡位造成的少量差異接受。"}
- {id: Q02, where: shots.s023.motion.subject, category: 5, severity: medium, status: resolved,
   question: "[21,1]、[21,1.5]、[21,2] 她身體的灰色範圍各是什麼？兩邊怎麼『會合』？",
   resolution: "surge 在 [21,1.5]–[21,1.75] 掃過軀幹與雙腿；@luna_fade 從手腕沿手臂往肩膀、從馬尾往頭推進；[21,2] 在雙肩與脖子會合。新增 [21,1.5] beat_event。"}
- {id: Q03, where: shots.s023.motion.camera, category: 5, severity: low, status: resolved,
   question: "push_in 8% 是整鏡累計還是只在 [21,2]–[22,1]？",
   resolution: "只在 [21,2]–[22,1] 推 8%，之前鏡頭靜止。"}
- {id: Q04, where: shots.s023.notes, category: 8, severity: low, status: resolved,
   question: "s023 要幾張靜態圖？首幀的局部灰畫在圖上還是後製做？",
   resolution: "兩張（全彩版、全灰版）；首幀局部灰、surge、褪色推進都由後製遮罩在兩張之間過渡。"}
- {id: Q05, where: shots.s024.motion.subject, category: 5, severity: medium, status: resolved,
   question: "0.4 倍慢動作下，各時間點是輸出時間還是模型片段時間？",
   resolution: "全部是輸出時間；模型以 1 倍速產生約 1 秒的動作，後製放慢後落在這些時間點（寫進 motion）。"}
- {id: Q06, where: shots.s024.last_frame, category: 6, severity: medium, status: resolved,
   question: "s024 末幀她離地幾公尺？下墜時間合不合理？",
   resolution: "她從 [22,1] 起接著 s022 的下墜往下掉（不是等到張臂後），扣掉慢動作約 1 秒實際時間，8.5 m 掉到約 2 m；s024 末幀寫明離地約 2 m，s025 首幀改 2 m、落地改 [23,1.3]；鏡頭往下搖改約 35°，末幀背景改成一樓櫥窗與二樓看板。"}
- {id: Q07, where: glossary.broadcast_wave.look.front, category: 10, severity: medium, status: resolved,
   question: "『4 幀後消失』指熱浪折射還是整道光環？",
   resolution: "光環一路維持到停住才淡掉；只有熱浪折射維持 4 幀。"}
- {id: Q08, where: shots.s025.subjects.broadcast_wave, category: 4, severity: high, status: resolved,
   question: "光環的『半徑』與『占畫面寬 %』混用，末幀要不要碰到畫面邊緣？",
   resolution: "畫面寬 600 m 不變；百分比改寫成直徑（33%→50%），末幀圓的左右兩側各離畫面邊緣約 25%。"}
- {id: Q09, where: shots.s025.subjects.luna, category: 4, severity: medium, status: resolved,
   question: "她在 600 m 寬的俯拍裡要畫多大？",
   resolution: "照真實比例約畫面高 0.5%，靠彩色圓的圓心與 @drone 白點辨認。"}
- {id: Q10, where: shots.s026.notes, category: 8, severity: medium, status: resolved,
   question: "繞行鏡頭下，後製光帶怎麼保持透視？",
   resolution: "先對模型片段做相機追蹤（camera solve），再把光帶擺在 3D 位置。"}
- {id: Q11, where: shots.s028.transition_in, category: 6, severity: medium, status: resolved,
   question: "跳接省略的是 1.5 km 還是 3 km？",
   resolution: "改為約 1.5 km（s027 的街尾）；3 km 是 @launch_roof 到塔的距離。"}
- {id: Q12, where: shots.s028.subjects.luna, category: 4, severity: high, status: resolved,
   question: "她離鏡頭、離塔各多遠？『跑進來』與首幀已在畫面內如何對齊？",
   resolution: "鏡頭離塔身約 10 m，塔身占畫面寬約 70%；她離鏡頭約 4 m、在塔身前約 6 m 停下；首幀她已在畫面內奔跑中，跑完最後兩步停下。末幀觀景台寬改約畫面寬 25%。"}
- {id: Q13, where: shots.s029.motion.subject, category: 5, severity: high, status: resolved,
   question: "s029 灰彩交界末值是 28 m 還是 20 m？",
   resolution: "改為 16 → 約 28 m（每秒約 5 m，符合標頭）。"}
- {id: Q14, where: shots.s029.last_frame, category: 6, severity: high, status: resolved,
   question: "她何時越過灰色？",
   resolution: "統一為 [28,1.72]（s030 內第一次蹬跳中）；s029 末幀她在交界下方（交界在她頭頂上方約 2 m）；刪掉 [27,4] 的『越過』。s030 加 [28,1.72] beat_event。"}
- {id: Q15, where: shots.s029.motion.subject, category: 5, severity: low, status: resolved,
   question: "哪幾次蹬跳要畫恢復區塊？",
   resolution: "只有落點在灰色範圍內的才畫（寫進標頭）；s029 三次都在灰色內，s030 起落在彩色區不畫。"}
- {id: Q16, where: shots.s030.subjects.luna, category: 6, severity: medium, status: resolved,
   question: "s030 起點是 24 m 還是 30 m？",
   resolution: "起點 24 m，8 拍 × 8 m 到 88 m。"}
- {id: Q17, where: shots.s030.motion.camera, category: 5, severity: medium, status: resolved,
   question: "鏡頭升高 30 m 與末幀百分比哪個為準？",
   resolution: "重算：鏡頭升高約 20 m，首幀涵蓋離地 15–135 m、末幀 35–155 m；她 92%→56%、灰色 89%→87%。"}
- {id: Q18, where: shots.s024.last_frame, category: 4, severity: medium, status: resolved,
   question: "『畫面高約 N%』從上緣還是下緣量？",
   resolution: "一律從畫面上緣往下量，寫進 plan/README.md 的「方向」與 Chorus 1 標頭；與 Prechorus 以前的寫法一致。"}
- {id: Q19, where: shots.s030.first_frame, category: 4, severity: medium, status: resolved,
   question: "首幀她離灰色的畫面距離要多少？",
   resolution: "她在約 92%、灰色在約 89%，她剛好在交界下方約 4 m（與 Q14 一致）。"}
