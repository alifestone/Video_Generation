- id: Q13
  where: glossary.luna_fade.look.progress
  category: 3
  quote: 指尖到第一指節
  problem: 手指有三節，「第一指節」「第二指節」可以從指尖數、也可以從指根數；拇指只有兩節；灰色是停在關節處還是指節中間也沒說，s019 要畫「第一指節→第二指節」的差別時，沒有人知道哪一段是灰的。
  question: 第一指節是從指尖數起的第一節（指尖那一節）還是第一個關節（指尖往下第一條橫紋）？拇指怎麼算？灰色邊界停在關節橫紋，還是節的中間？
  options:
  - 從指尖數：第一指節＝最末一節，第二指節＝最末兩節；邊界停在關節橫紋；拇指把兩節算成第一、第二節的 1/2 與全部
  - 改寫成長度（指尖往上 1.5 cm、3 cm），不用指節
  severity: medium
  status: resolved
  resolution: Claude 決定（依授權，2026-10-23）。從指尖往下數，邊界停在關節橫紋，拇指只有兩節；progress 改寫成「最末一節／最末兩節／整根手指／到手腕」。
- id: Q14
  where: glossary.luna_fade.look.start
  category: 1
  quote: 從紫色編髮的髮尾與雙手指尖同時往上退
  problem: style_bible 寫的是「深紫高馬尾，頭頂到後腦有編髮，銀色細鏈編進髮束並垂到背後」：編髮只在頭頂到後腦，垂下來的是馬尾，沒有一條垂到肩前的辮子；「編髮的髮尾」「編髮下 1/3」「編髮下段」到底指馬尾、還是馬尾裡的髮束，髮尾約 5/10 cm 與「下 1/3」又是以多長的髮束算（馬尾長度未定），銀鏈編在髮束裡會不會跟著變灰也沒寫。
  question: 變灰的是馬尾的下端嗎？馬尾（或髮束）總長多少 cm，「下 1/3」等於幾 cm，與「髮尾約 10 cm」是否一致？編進髮束的銀鏈在灰色範圍內算不算變灰？
  options:
  - 變灰的是馬尾下端；馬尾總長約 30 cm，下 1/3＝約 10 cm；銀鏈不變灰（照 not_this）
  - 變灰的是馬尾下端，銀鏈在該範圍內也變成灰階（只是看起來更暗）
  - 把「編髮」全部改稱「馬尾」，並在 look 補長度
  severity: high
  status: resolved
  resolution: Claude 決定（依授權，2026-10-23）。依 style_bible：變灰的是馬尾下端（馬尾從綁起處垂下約 55 cm，以 refs/03_back 為準）；[19,1] 4 cm、[19,3] 8 cm、[20,3] 14 cm、[21,1] 18 cm（約下 1/3）；銀鏈不變灰。shots 的「編髮」全部改成馬尾。
- id: Q15
  where: shots.s019.motion.subject.text
  category: 5
  quote: 手臂隨奔跑前後擺動一次半
  problem: 本鏡 2 拍，而 s018 的步頻是每半拍一步（一個手臂完整擺動＝2 步＝1 拍），2 拍應是 2 個完整擺動；寫「一次半」與步頻不符。而且首幀手在「往前擺到畫面正中」，擺一次半之後手會在往後擺的位置，不是「再次擺到正中」前進方向；手是往前還是往後經過畫面中央，末幀沒寫。
  question: 本鏡手臂完整擺動幾次？末幀手是「往前擺到畫面正中」（與首幀相同相位）還是往後經過畫面中央？
  options:
  - 擺動 2 次（2 拍＝2 個步幅循環），末幀與首幀相同相位，手在前擺最高點
  - 擺動一次半，末幀手在往後擺的瞬間經過畫面中央
  severity: medium
  status: resolved
  resolution: Claude 決定（依授權，2026-10-23）。2 拍＝完整擺動 2 次，末幀與首幀同相位。
- id: Q16
  where: shots.s019.first_frame
