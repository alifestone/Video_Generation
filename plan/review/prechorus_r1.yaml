# Prechorus（s017–s022）第 1 輪歧義審稿（tools/prompts/plan_critic.md，Claude Sonnet 5.5，2026-10-23）
# status：open＝等使用者回答；resolved＝已處理（resolution 寫怎麼處理）
round: prechorus_r1
issues:
- id: Q01
  where: shots.s017.motion.subject.text
  category: 1
  quote: 那台車變回原色（珍珠白、深藍、酒紅）
  problem: '@restore_touch.footstep_patch 是「落腳點半徑內的東西」（圓形區塊），但 s017 寫整台車變回原色，s018 first_frame 又寫車頂上有「彩色的圓形區塊」（車頂上一塊彩色、其餘仍灰）；車長 4.5 m 而半徑 3 m，車只有一部分在圓內時，是整台恢復還是只有圓內恢復，兩處寫法互相矛盾。'
  question: 踩在車頂上時，恢復的是（a）整台車（半徑內只要碰到車就整台恢復，圓外的車身也變色）還是（b）只有圓內的那一塊車頂？半徑內碰到的鄰車（s017 的台階車相距不到 3 m 時）也會恢復嗎？
  options:
  - 整台車恢復（與 restore 整個物體的既有規則一致），圓形只決定「哪些物體被選中」，被選中的物體整個恢復
  - 只有圓內的表面恢復，車身上出現圓形彩色區塊，邊緣用 @silence 邊界的約 1 m 漸層帶
  - 車與地面不同規則：地面、雨用圓形區塊，車整台恢復
  severity: high
  status: resolved
  resolution: Claude 決定（依授權，2026-10-23）。圓形決定「哪些東西被選中」：個別物體（車、雨滴、路人）整個恢復，連續表面（路面、牆面）只恢復圓內；寫進 glossary footstep_patch，s017/s018 改寫成整台車恢復。
- id: Q02
  where: shots.s017.subjects.hovercar / shots.s017.last_frame
  category: 7
  quote: 腳下那台車仍是恢復的深藍色
  problem: motion 的顏色清單依序寫「珍珠白、深藍、酒紅」，而第 1、2、3 台各是什麼顏色從未對應；last_frame 說第 3 台是深藍色，與清單順序（第 3 台＝酒紅）矛盾。
  question: 第 1、2、3 台 @hovercar 的車殼顏色各是什麼？車底燈帶各是青還是洋紅？
  options:
  - 第 1 台珍珠白、第 2 台酒紅、第 3 台深藍（符合 last_frame），燈帶依序青、洋紅、青
  - 依清單順序：珍珠白、深藍、酒紅；last_frame 改成酒紅
  severity: high
  status: resolved
  resolution: Claude 決定（依授權，2026-10-23）。第 1 台珍珠白（青燈帶）、第 2 台酒紅（洋紅燈帶）、第 3 台深藍（青燈帶），與 last_frame 一致。
- id: Q03
  where: shots.s018.first_frame / shots.s017.last_frame
  category: 6
  quote: 一排頭尾相接、車頂離地約 7 m 的車
  problem: s017 末幀她站在離地約 5 m 的第 3 台車頂（鏡頭 5.5 m），s018 首幀（同一個 [18,1] 拍點）她在離地約 7 m 的車道車頂、鏡頭 7 m，兩者高度差 2 m，transition_in 又只是 cut；s017 末幀腳下那台深藍車仍在恢復中，s018 首幀卻沒說明她腳下是不是同一台車。
  question: s017 到 s018 之間，她是怎麼從 5 m 的車頂到 7 m 的車道？第 3 台車是否就是 s018 車道上的第一台（即第 3 台車頂應改為約 7 m），或兩鏡之間要補一個爬升動作？transition_in 要不要改成 cut_on_action？
  options:
  - 把 s017 第 3 台車頂改成約 7 m（在車道高度），s018 接同一台車，transition_in 改 cut_on_action
  - 維持 5 m，s018 首幀時她剛從第 3 台再跳上一台 7 m 的車，s017 末幀不變
  - s018 車道高度改為約 5 m
  severity: high
  status: resolved
  resolution: Claude 決定（依授權，2026-10-23）。第 3 台車頂改為約 7 m（就是車道上的第一台），三台高度 2 m、4.5 m、7 m；s018 接同一台深藍車，transition_in 改 cut_on_action。
- id: Q04
  where: glossary.hovercar.look.motion
  category: 4
  quote: 恢復時沿原本方向以約每秒 5 m 滑行
  problem: 恢復的車以每秒 5 m 滑行，恢復約 22–28 幀（約 1 s）會滑 4–5 m，但 s018 車與車的間隔只有 1.5–3 m，會撞上或穿過前車；「原本方向」也沒說是車頭方向還是畫面右、車頭朝哪；她站在車上時是否被帶著走、鏡頭與她的相對位置也沒寫。
  question: 車滑行的方向（車頭朝畫面哪邊）、總距離、退回灰色後停在滑行後的位置嗎？前方有車時（s018 間隔 1.5–3 m）怎麼處理？她在車上時，她的位置是否相對車頂改變（車載著她前進）？
  options:
  - 車頭一律朝畫面右（街尾）；滑行距離限制在不超過前車間隔（約 1 m 內），不會碰到前車
  - 車滑行但前車也被圓形區塊恢復、一起滑，整排車同步前進
  - 只在落腳的那台車滑，滑行距離寫死（例如 2 m），退回後停在新位置
  severity: high
  status: resolved
  resolution: Claude 決定（依授權，2026-10-23）。恢復的車不前進：車底燈帶亮起、原地浮動約 5 cm，被踩到時一沉約 15 cm 再浮回；glossary hovercar.motion 改寫，避免撞上前車。
- id: Q05
  where: shots.s017.motion.subject.text
  category: 2
  quote: 之後在第 3 台車頂上繼續跑
  problem: glossary 寫「她每一步落地」都踩出區塊，但 s017 只在 3 次落車頂（[17,2]、[17,3]、[17,4]）寫了區塊；起跑後 [17,1]–[17,1.5] 在地面的步、落車後到下一次起跳之間的步、第 3 台車頂上的步，是否也各自產生半徑 3 m 的區塊，沒有寫。
  question: s017 裡是只有 3 次落車頂會產生區塊，還是每一步（包括地面上的步與車頂上的步）都產生？如果每一步都產生，首幀（全灰）與 [17,1]–[17,1.5] 地面上的區塊要不要畫？
  options:
  - 每一步都產生，與 s018 一致；s017 beat_events 補上地面與車頂上的步，首幀仍全灰（第一步在首幀之後）
  - s017 只有 3 次落車頂產生，並在 glossary footstep_patch 註明「踩上車頂／高處落點才產生」
  severity: medium
  status: resolved
  resolution: Claude 決定（依授權，2026-10-23）。每一步落地都產生區塊（含地面上的步），s017 首幀仍全灰（第一步在首幀之後）。
- id: Q06
  where: shots.s017.last_frame
  category: 5
  quote: 畫面左下是前兩台已退回灰色的車
  problem: 每個區塊是 4 幀擴張＋約 18 幀維持＋6 幀退回，共約 28 幀（約 2.1 拍）。第 2 台車 [17,3] 落地，到本鏡結束 [18,1] 只有約 26.4 幀，還在最後退回的途中，不是「已退回灰色」；且「約 18 幀後」是從落地還是從擴張完成起算也不明。
  question: 「約 18 幀後在 6 幀內退回」的 18 幀是從落地那幀起算，還是從擴張完成（落地後第 4 幀）起算？在這個定義下，末幀第 2 台車是已全灰還是退回到一半？
  options:
  - 18 幀從落地起算（含 4 幀擴張），總共 24 幀後全灰；末幀第 2 台已全灰
  - 18 幀是擴張完成後的維持時間（glossary 原意），總共 28 幀；末幀第 2 台還剩約 1 幀的最後一點顏色，改寫 last_frame
  severity: medium
  status: resolved
  resolution: Claude 決定（依授權，2026-10-23）。從落地那一幀起算：4 幀擴張＋18 幀維持＋6 幀退回＝28 幀；s017 末幀第 1 台全灰、第 2 台酒紅淡到約 1/10。
