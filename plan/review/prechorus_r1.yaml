  where: shots.s017.subjects.hovercar
  category: 4
  quote: 像台階一樣往畫面右上排；每台長約畫面寬 25%
  problem: 只給車頂高度與車長，沒有水平間距：第 1 台離起跳點多遠、台與台之間的水平距離（空隙）、有沒有前後重疊，都沒寫，而每次騰空只有半拍（約 6–7 幀）；她助跑落在高 1.2 m、3 m、5 m 的車頂需要的水平距離不同，畫面也畫不出來。
  question: 3 台車的水平間隔（車尾到下一台車頭的距離）各是多少？車頂階差 1.2→3→5 m 的情況下，起跳點到第 1 台車頭的水平距離是多少？
  options:
  - 每台間隔約 2 m（車尾到車頭），第 1 台車頭離起跳點約 3 m
  - 車首尾相接重疊（像階梯），不留空隙，她直接踏上去
  severity: medium
  status: resolved
  resolution: Claude 決定（依授權，2026-10-23）。第 1 台車尾離起跳點約 3 m，台與台之間水平空隙約 1.5 m。
