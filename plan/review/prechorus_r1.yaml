  question: '景別標 LS 要以末幀（25%）還是首幀（50%）為準？placement 的 y: upper 是指末幀嗎，是否要拆成首幀、末幀兩個位置？'
  options:
  - 景別改標 MLS（首幀 50%），placement 補 first／last 兩個位置
  - 維持 LS，首幀身高改為約畫面高 45%
  severity: low
  status: resolved
  resolution: Claude 決定（依授權，2026-10-23）。維持 LS，首幀身高改為約畫面高 45%，size 分寫首幀與末幀。
