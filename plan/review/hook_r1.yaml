  where: shots.s008.first_frame
  category: 5
  quote: 艙口在畫面水平正中、畫面下方，兩片半圓鋼板關著
  problem: 兩片半圓鋼板是左右滑開（沿畫面左右），那接縫是前後向（朝向鏡頭）的直線；first_frame 沒有說接縫在畫面上是一條垂直線還是橫線，而且鏡頭在 8 m 外、離地 1.2 m 的低角度，圓形艙口在畫面上是一個很扁的橢圓。
  question: 首幀艙口的接縫在畫面上是哪個方向？兩片鋼板是左右（畫面左右）滑開，還是前後（朝向鏡頭／遠離鏡頭）滑開？
  options:
  - 接縫是朝向鏡頭的一條直線（在扁橢圓上看是縱向短線），鋼板往畫面左右滑開
  - 鋼板往畫面前後滑開（一片朝向鏡頭、一片遠離）
  - 接縫與滑開方向由模型決定，只要求兩片分開、露出白光
  severity: low
  status: resolved
  resolution: Claude 決定（依授權，2026-10-23）。鋼板接縫是一條朝向 @city（遠方）的直線，在首幀低角度下是從畫面下方往遠處延伸的短直線；兩片往接縫兩側（畫面左右）滑開。
