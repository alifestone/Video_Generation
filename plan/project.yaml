# 每支影片開頭由使用者決定的參數。lint 依這些值檢查 story 與 shots。
schema_version: 1
title: LUNA MV
timeline: analysis/timeline.json
lyrics: audio/lyrics.srt
character_refs: refs/
style_bible: docs/style_bible.md

params:
  narrative_type: story          # story | performance | mixed | abstract
  lyric_mapping: section         # section（段落層對應）| line（每句都有畫面）| literal（字面照畫）
  dance_shots: 0                 # 舞蹈英雄鏡頭數；0 = 不跳舞
  lip_sync: false                # LUNA 不唱歌、不對嘴
  second_characters:             # 允許的第二角色種類
    allowed: [non_human, designed_human]
    extras_count_as_character: false   # 路人不算第二角色
  props_in_hand: allowed         # allowed | brief_only | forbidden
  scene_limit: null              # null = 不設限
  max_shot_bars: 2               # 一般鏡頭長度上限（小節）
  brand_text: post_only          # 畫面內不出現任何文字；字標與字卡只在後製疊
  brand_appears_if: story_relevant   # CSFCCA 只在劇情相關時出現

decisions:                       # 使用者已確認的方向（2026-10-23）
  concept: A 靜默協議
  silence_form: area_only        # 靜默只是一片擴散的灰色區域，沒有核心或形體
  drone: plot_role               # 無人機夥伴要負責劇情功能
  ending: victory_with_hook      # 勝利後留伏筆
  banned_motifs: [光鯨]
  # 2026-10-23 回答 A01–A12（未留言的題目＝接受目前設定）
  drone_name: ECHO               # A01：只是設定名稱，外殼上不出現文字
  hq_control_staff: none         # A03：控制室沒有人員，只有 ECHO
  city_style: near_future        # A04：懸浮車、全息看板（無文字）
  frozen_passersby: gray_statue  # A05：frozen 城市的路人是定格的灰色人形
  countdown_numbers: deferred    # A07：「3、2、1」數字字卡先不疊，完整影片產出後再決定
  final_frame: look_back_to_camera   # A10：outro 最後一格 LUNA 回頭看鏡頭
  hook_transition_in: {type: flash_white, frames: 2}   # A12：Hook 第一鏡的進場轉場
  # 2026-10-23 Hook（storyboard session）
  launch_tunnel_look: ring_shaft         # 光環豎井
  launch_method: platform                # 站在 @pod 底座平台上被送上去
  tunnel_exit: rooftop                   # 出口在高樓樓頂（@launch_roof）
  drone_in_hook: rises_with_luna         # ECHO 跟在她旁邊上升
  hook_structure: 3_shots                # bar5、bar6 各一鏡，bar7–8 一鏡（揭示 2 小節）
  city_at_hook: near_gray_far_color      # 近處全灰、遠方還有彩色
  raindrop_touch: brief_restore          # 她碰到的雨滴短暫恢復（@restore_touch 預告）
  signal_tower_silhouette: spire_with_disc   # 細長尖塔＋圓盤觀景台；細節到 Chorus 1 前再問
  signal_tower_at_hook: color_zone_threatened  # 塔在彩色區，灰色正逼近
  roof_hatch_opened_by: echo_beam        # 艙口由 ECHO 光束打開（仍維持灰色）
  exit_action: leap_kneel_landing        # 她躍出艙口、單膝落地
  # 2026-10-23 Verse
  verse_descent: cut_to_street           # 樓頂到街上直接切，不拍下樓
  verse_touches: [puddle, balloon, child]   # 觸碰恢復的對象：水窪、氣球、路人小孩
  child_and_balloon: chasing             # 小孩在追氣球（同一件事）
  not_enough_shown_by: revert_and_distant_advance   # 恢復的東西變回灰＋遠方彩色區被吞
  drone_points_by: tower_hologram        # ECHO 投影小全息塔指路
  verse_structure: 8_shots_1_bar         # 8 鏡各 1 小節
  silence_speed: 30_m_per_s              # 靜默邊界平常每秒約 30 m（Prechorus 例外，見下）
  # 2026-10-23 Prechorus
  prechorus_countdown: none              # ECHO 不再投影倒數；壓迫感靠灰色與剪接
  power_growth: footstep_patch           # 能力變強：每一步踩出半徑約 3 m 的恢復區塊（越弱越小）
  prechorus_travel: hovercar_parkour     # 踩定格懸浮車跑酷
  swallowed_because: overuse_fade        # 用太多能力而衰弱；髮尾與指尖先變灰
  prechorus_structure: 6_shots_half_bar_cuts   # bar 17、18 各一鏡，bar 19–20 半小節快切
  silence_speed_prechorus: 100_m_per_s   # Prechorus（bar 17–20）加速到每秒約 100 m
  swallow_handoff: fade_and_surge        # bar 21 吞沒：她身上的褪色往內擴散＋下方湧上的邊界帶，在她身上會合
  # 2026-10-23 Chorus 1
  tower_material: dark_metal_light_lines # 訊號塔：深色金屬塔身＋發光線條
  tower_lights: layered_bands            # 塔身一圈圈分層燈帶
  tower_interior: deck_control_room      # 內部＝圓盤觀景台裡的圓形廣播控制室（Bridge 在此）
  tower_climb: exterior_parkour          # 沿外牆跑跳登塔
  echo_at_swallow: frozen_with_luna      # bar 21 ECHO 和她一起被凍住，bar 22 衝擊波一起救回
  first_broadcast: arms_open_chest_burst # 張開雙臂，顏色從胸口炸開（Final Chorus 要另外做出差異）
  shockwave_reach: one_block_then_jump_cut   # 只恢復約一個街區，接著跳接到塔下
  restored_block_after: reswallowed_after_seconds   # 幾秒後邊界又開始往內推，登塔時持續有時間壓力
  tower_footholds: ribs_and_platforms    # 外牆有垂直結構肋＋維修平台，她在肋與平台間蹬跳
  tower_chase: gray_climbs_tower         # 灰色從塔底沿塔身往上爬追她
  chorus1_end: echo_opens_window         # bar 33：ECHO 用光束開一扇全景窗，她翻進控制室
  chorus1_structure: 14_shots_half_bar_end   # 使用者交給 Claude 決定：bar 21–31 每鏡 1 小節（bar 28–29 一鏡 2 小節），bar 32–33 半小節快切
  # 2026-10-24 Bridge（bridge session）
  bridge_mechanism: hands_on_tour        # 動手開機巡一圈：Create 拍主控台、Make 推副控台推桿、Show 窗生成影像、Dream 送 ECHO 進插座、Build 光柱逐段亮、Unfold 塔外燈帶往上亮
  bridge_world_stutter: one_window_per_hit   # 「world world w w w world」：窗上影像不閃動，跟著每一聲一片接一片生成
  echo_in_bridge: system_core            # ECHO 降進主控台插座當訊號核心，Build 時隨光升到光柱頂端
  window_images: city_restored_views     # 窗上影像＝@city 各處恢復後的彩色版（沿用 @monitor_wall 的城市畫面）
  control_room_palette: cyan_magenta_accent  # 青為主、洋紅點綴，和塔外一致
  bridge_lighting: interior_then_exterior    # 室內為主，最後一鏡出塔外：燈帶由下往上一圈接一圈亮、天線亮起
  bridge_end_state: ready_not_broadcast  # Bridge 結束時系統只到就緒，廣播在 Build 倒數才發
  bridge_structure: 6_shots_per_verb     # 每個動詞一鏡，切點跟人聲
  # 2026-10-24 Build（bridge session）
  build_echo_fall: freeze_on_landing     # 斷電掉落，落地那一刻才被凍（不違反 @silence.motion）
  build_counterattack: tower_surge       # 灰色暴衝上塔、切斷廣播系統，控制室全暗
  build_first_shot: interior_victory_face   # 第一鏡回到室內她的勝利表情，接住「unfold」尾音
  echo_return: final_chorus_burst        # Final Chorus 爆發時 ECHO 恢復、回到她肩旁
  build_countdown: body_as_source        # 雙手按住熄滅的光柱，每數一聲她的顏色灌進去亮一段
  build_freeze: shrinking_color_sphere   # 她的顏色撐住一個球形彩色圈（@luna_hold），每數一聲縮小，「1」時縮到她身上
  build_after_freeze: flashback_restored_things   # 凍住後閃回她恢復過的東西，全是灰的，最後回到她
  build_structure: claude_decides        # 鏡頭數交給 Claude：10 鏡（bar 37 快切 4 鏡、bar 38 定格 1 鏡、bar 39 閃回 4 鏡、bar 40 回到她 1 鏡）
  # 2026-10-24 Final Chorus～Outro（Claude 代決：使用者授權「自行完成所有任務直到 P3 結束」，以下皆可改）
  final_burst: palms_through_column      # 顏色從貼著光柱的掌心回到全身，灰色被頂開吹散；力量順光柱上天線（和 bar 22 的胸口衝擊波做出差異）
  full_broadcast_origin: antenna_top     # 全頻廣播從天線頂端發出（@full_broadcast），不是從她身上
  final_chorus_echo: restored_by_wave    # 波掃過控制室時 ECHO 恢復、飛回她肩旁
  city_restore_shown_by: aerial_then_street   # 先俯瞰整座城被波掃過，再回到 @street 的街面
  media_lyrics: three_billboards         # 「讓電影、讓音樂、讓動畫」＝三面看板各播一種（@billboard_media），各半小節
  final_chorus_end: stand_on_parapet_fist   # 「這不是等待未來」：她站上外環走道矮牆，「LIVE AI」時舉拳
  post_chorus_recap: same_four_as_flashback # 回顧用 Build 閃回的同四個構圖，一灰一彩對照；@balloon_child 不再出現，只拍飛走的 @balloon
  post_chorus_peak: citywide_light_pulse # bar 53 全城的燈同時亮一下＋閃白 2 幀
  dawn: post_chorus_end                  # Post-chorus 最後地平線開始天亮
  outro_transition: dissolve_time_skip   # 從塔上溶接回 CSFCCA 控制室，不拍回去的過程
  late_structure: 22_shots               # Final Chorus 11 鏡、Post-chorus 9 鏡、Outro 2 鏡
