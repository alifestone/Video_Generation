# P6 關鍵幀 job 定義（tools/p6_keyframes.py 讀這份）。內容正本是 plan/shots.yaml 的 first_frame／last_frame；這裡只放「怎麼生」：
#   qwen        Qwen-Image-Edit 的英文說明（A）。image1 一律是角色表，refs 依序是 image2、image3…；
#               refs 可用 {first}／{mid}／{last}＝同鏡該幀的中間稿（B，沒有 B 就用 A）、{first:final}＝該幀最終稿，seed 對應同 seed（srcseed 可改）。
#   lora        false＝不做 B（環境鏡只留 A）；預設 true＝B：Illustrious＋LUNA LoRA v2 img2img＋canny。
#   tags        B 的 Danbooru tag 覆寫（預設用 plan/p5_prompts.yaml 該鏡 keyframe.first／last，剝掉固定外觀與品質 tag 後重組）；
#               tags_add／tags_drop 增刪個別 tag。ECHO 由後製貼，所以 B 的 tag 不放 drone 相關。
#   denoise     B 的 denoise（預設 0.6）
#   controlnet  {pose: 內嵌關鍵點 dict 或骨架圖路徑, pose_strength, pose_end, canny, canny_strength, canny_end}（路線 B：OpenPose＋A 的邊緣當參考線稿）
#   region      [x0,y0,x1,y1]（1344×768 像素）：B 只重繪這個區域（小人物用，放大後重繪再羽化貼回）
#   post        後製步驟 list：grey／paste_drone／platform_dot／black_line／zoom／shift（見 tools/p6_keyframes.py）
#   seeds       候選的 seed；variants 可讓不同 seed 用不同 refs／說明
#   gen: proc   程式繪製（不經 Qwen），由 post 的 op 畫
# 灰色（frozen）的東西一律後製去飽和，tag 不寫 greyscale（p5_decisions D03）。字標與歌詞不畫（P9 疊）。

macros:
  STYLE: >-
    Clean Japanese anime cel shading with thin black line art, flat colors, anime background art.
    No text, no letters, no numbers, no logos anywhere.
  # 外觀五項（docs/style_bible.md）：臉、紫色高馬尾編髮＋銀鏈、白色無袖高領拉鍊上衣、腿環只在角色右腿、手指數
  CHAR_FACE: >-
    Her face is slim with a pointed chin, almond-shaped dark purple-grey eyes, thin eyebrows and a small silver earring on the earlobe.
  CHAR_HAIR: >-
    Her hair is a dark purple high ponytail made of a straight bundle of hair, with braids only on the crown of her head and a thin silver chain braided into the hair
    and hanging down along the ponytail, with a few loose bangs on her forehead.
  CHAR_TOP: >-
    She wears a white sleeveless high-collar zip-up crop top with a silver zipper running from the collar straight down to the hem, and a bare midriff.
  CHAR_LOWER: >-
    She wears a white cargo mini skirt with two big pockets, a black belt with a long black strap hanging down, silver bracelets on both wrists, white ankle socks and white chunky sneakers.
  LEG_FRONT: >-
    She has exactly one black thigh strap with a silver buckle, only on her right leg, which is on the LEFT side of the image because she faces the viewer; her other leg is bare.
  LEG_BACK: >-
    She has exactly one black thigh strap with a silver buckle, only on her right leg, which is on the RIGHT side of the image because she is seen from behind; her other leg is bare.
  FINGERS: Each visible hand has exactly five fingers.
  KEEP_SHEET: >-
    Keep the exact same character and outfit as the reference sheet in image 1.

shots:
  s001:
    frames:
      first:
        desc: 主螢幕黑色玻璃面佔滿畫面，水平正中、畫面高 45% 處一條幾乎平直的青色 @signal_wave
        lora: false
        variants:
          - seeds: [1, 2, 3, 4]
            post:   # Qwen 都把線放在畫面高 50%、螢幕玻璃邊緣會露出一圈淡框：放大 1.08 倍裁掉淡框，同時把線移到 45%
              - {op: zoom, z: 1.08, cx: 0.5, cy: 0.5463}
            qwen: >-
              Image 1 is an unrelated character sheet: ignore it completely and do not draw any character.
              Create a minimalist flat anime-style image of a completely black glass monitor surface that fills the whole picture edge to edge,
              with no frame, no bezel, no border and no edges of the screen visible anywhere.
              The glass is almost pure black with only an extremely faint soft reflection.
              Exactly one thin, perfectly straight, perfectly horizontal glowing cyan line (colour #29d3f5) crosses the picture from 10 percent to 90 percent of the width,
              positioned at exactly 45 percent of the image height measured from the top edge, slightly above the vertical centre.
              The line is very thin, about half a percent of the image height, and it has a soft faint cyan glow around it about three line widths wide.
              The line is flat, with no bumps, no peaks, no waveform and no zigzag. Nothing else in the image: no grid, no axes, no tick marks, no numbers, no text, no icons.
          - seeds: [5, 6]     # 程式繪製：位置精確、玻璃反光很淡
            gen: proc
            post:
              - {op: black_line, y: 0.45, x0: 0.10, x1: 0.90}
          - seeds: [7, 8]     # 程式繪製：玻璃反光較明顯、線較粗且光暈較強
            gen: proc
            post:
              - {op: black_line, y: 0.45, x0: 0.10, x1: 0.90, refl: 14, glow: 0.9, lw_scale: 1.3}

  s006:
    frames:
      first:
        desc: 豎井裡由下往上仰拍 LUNA 膝以上，抬頭看上方；ECHO 在右上（後製貼）；只用首幀。背景＝refs/p6/s006_shaft_bg.png（refs/entities/launch_tunnel/shaft.png 取消失點以下的下半部，消失點在畫面高約 8%、燈環是往下彎的弧）
        seeds: [1, 2, 3, 4, 5, 6]
        refs: [refs/p6/s006_shaft_bg.png]
        tags: >-
          cowboy shot, from below, looking up, clenched hands, arms at sides, standing, closed mouth, lit from below, white light from below,
          hair blown downward, wind, vertical shaft, dark tunnel, cyan ring lights, concentric rings, vanishing point, wide angle
        pre:    # Qwen 都把她拍成全身（膝蓋落在畫面高 62%）：先放大 1.5 倍裁切（頂端對齊），讓頭頂約在 9–12%、膝蓋接近畫面下緣，再做 B
          - {op: zoom, z: 1.5, cx: 0.5, cy: 0.3333}
        post:
          - {op: paste_drone, cx: 0.70, cy: 0.30, diam: 0.19}
        qwen: >-
          Image 1 is the character sheet, image 2 is the background, the inside of a black vertical shaft seen from below with glowing cyan ring lights that converge to a black vanishing point at the top.
          Keep the background of image 2 exactly as it is, the same rings, the same colours and the same vanishing point at the top, and add the girl from image 1 in front of it:
          low-angle shot from below, knees-up framing, she stands in the exact centre of the frame facing the camera, the bottom edge of the frame cuts her at the knees,
          and the top of her head is at about 15 percent of the image height, so she is large and fills most of the image height.
          Her feet are shoulder width apart and her knees are slightly bent, her arms hang at her sides with both hands in loose fists,
          and her chin is raised and her head tilted back so that she looks up toward the vanishing point at the top of the shaft, with a determined, firm expression, her mouth closed and her eyes open.
          Her face and white clothes are lit brightly from below by white light, with normal exposure so that the clothes show folds.
          Her long ponytail hangs straight down behind her head and her back under its own weight, hanging vertically with only the tips fluttering slightly; it does not fly up and does not blow sideways.
          There is no drone, no floating sphere and no platform visible. <<CHAR_FACE>> <<CHAR_HAIR>> <<CHAR_TOP>> <<LEG_FRONT>> <<FINGERS>> <<KEEP_SHEET>> <<STYLE>>

  s005:
    frames:
      first:
        desc: 透過（後製疊的）光環中央看 @pod 裡的 LUNA：MCU 胸口以上，臉在畫面正中，睜眼直視鏡頭、嘴閉；光環與臉上青光由後製疊，所以不畫
        variants:
          - seeds: [1, 2, 3, 4]      # 以 P4 已選定的 s003 關鍵幀當艙與背景的參考，保持同一個艙、同一面灰色螢幕牆
            refs: [shots/s003/keyframe.png]
            qwen: >-
              Image 1 is the character sheet, image 2 shows the same glass capsule and the same blurred greyscale monitor wall that this scene needs, with the same girl inside.
              Make a new medium close-up of this same scene, with the camera straight in front of the capsule at eye level but much closer:
              the girl is framed from the chest up, her face exactly in the centre of the frame, her shoulders and upper chest along the bottom of the frame,
              her head upright and facing the camera. Curved transparent glass of the capsule surrounds her with faint light reflections.
              Her eyes are wide open and look straight into the camera with a firm, determined gaze, and her mouth is closed with a serious, calm expression.
              Soft white light from the capsule base below the frame lights her face and her white top softly from below.
              Behind the glass the wall of greyscale monitor screens is completely out of focus, dark room.
              Do not draw any ring, any glowing circle or any cyan light on her face. <<CHAR_FACE>> <<CHAR_HAIR>> <<CHAR_TOP>> <<FINGERS>> <<KEEP_SHEET>> <<STYLE>>
          - seeds: [5, 6, 7, 8]      # 以 refs/entities 的艙與灰色螢幕牆重新合成（P4 s003 的做法）
            refs: [refs/entities/pod/closed.png, refs/entities/monitor_wall/frozen.png]
            qwen: >-
              Image 1 is the character sheet, image 2 shows the glass capsule pod, image 3 shows a wall of grey screens.
              Medium close-up, eye level, straight-on front view: the girl from image 1 stands inside the transparent glass tube of the capsule from image 2,
              framed from the chest up, her face exactly in the centre of the frame, her shoulders and upper chest along the bottom edge of the frame,
              her head upright and facing the camera. Her eyes are wide open and look straight into the camera with a firm, determined gaze, her mouth is closed, serious calm expression.
              The curved glass of the capsule fills the space around her with faint reflections, and soft white light from the capsule base below the frame lights her face from underneath.
              Behind the capsule is a wall of greyscale monitor screens, completely out of focus and blurred, dark room.
              Do not draw any ring, any glowing circle or any cyan light on her face. <<CHAR_FACE>> <<CHAR_HAIR>> <<CHAR_TOP>> <<FINGERS>> <<KEEP_SHEET>> <<STYLE>>
        tags: >-
          portrait, looking at viewer, closed mouth, calm, confident, standing inside glass capsule, glass reflection, lit from below, white light, dark room,
          blurry background, monitor wall, depth of field
        post:
          - {op: grey, where: [{rect: [0, 0, 1, 1], grey: true}, {ellipse: [0.2, 0.0, 0.8, 1.0], grey: false, feather: 30}]}   # 背景螢幕牆灰階（同 s003 的做法），LUNA 保持彩色
      last:
        desc: 同一構圖；青光已無；@pod 底座白光增強到白衣接近純白但仍有皺褶，臉仍看得清楚（光環弧熄滅成深灰由後製疊）
        seeds: [1, 2, 3, 4, 5, 6, 7, 8]
        refs: ["{first}"]
        qwen: >-
          Image 1 is the character sheet, image 2 is the first frame. Keep image 2 exactly as it is, with the same girl, the same framing, the same capsule glass, the same pose,
          her eyes open looking straight into the camera and her mouth closed, and change only the lighting:
          the white light from the capsule base below is now very strong, a bright white glow rises from the bottom of the frame,
          her white top is lit almost to pure white, but the fold lines and soft pale shading of the fabric stay visible, and her face stays clearly readable and not overexposed.
          The background behind the glass is darker. There is no ring and no cyan light. <<KEEP_SHEET>> <<STYLE>>
        post:
          - {op: grey, where: [{rect: [0, 0, 1, 1], grey: true}, {ellipse: [0.2, 0.0, 0.8, 1.0], grey: false, feather: 30}]}

