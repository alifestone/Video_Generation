# 名詞表：story.yaml 與 shots.yaml 只能用這裡的 id（實體寫 @id，詞彙直接寫值）。
# vocab 是跨影片共用的詞彙；entities 是這支影片的角色、場景、物件、特效、狀態。

vocab:
  shot_size:
    ECU: 大特寫，只拍眼睛或臉的一部分
    CU: 特寫，整張臉，下緣到下巴
    MCU: 近景，胸口以上
    MS: 中景，腰以上
    MLS: 中遠景，膝以上
    FS: 全身，頭頂到腳底都在畫面內
    LS: 遠景，人物高度不到畫面高的 1/2
    ELS: 大遠景，人物高度不到畫面高的 1/8，或畫面中沒有人物的環境全景
    INSERT: 物件或特效的特寫插入鏡，畫面中沒有角色的臉

  angle:
    eye: 平視，鏡頭與主體眼睛同高
    low: 仰角，鏡頭低於主體往上拍
    high: 俯角，鏡頭高於主體往下拍
    top: 正上方垂直往下
    dutch: 鏡頭沿光軸傾斜 10–20°

  camera_move:
    static: 鏡頭完全不動
    push_in: 鏡頭往前推近
    pull_out: 鏡頭往後拉遠
    pan_left: 鏡頭原地向畫面左轉
    pan_right: 鏡頭原地向畫面右轉
    tilt_up: 鏡頭原地往上仰
    tilt_down: 鏡頭原地往下俯
    track: 鏡頭平移跟著主體
    crane_up: 鏡頭垂直升高
    crane_down: 鏡頭垂直下降
    orbit_left: 鏡頭繞主體往畫面左繞
    orbit_right: 鏡頭繞主體往畫面右繞

  camera_speed:
    slow: 整鏡內畫面變化不超過 10%（推拉：主體大小變化 ≤10%）
    medium: 整鏡內畫面變化 10–30%
    fast: 整鏡內畫面變化超過 30%

  variation:        # 首幀到末幀的變化量；決定影片生成要不要用末幀（借自 ViMax）
    small: 首尾幀幾乎相同（只有呼吸、眨眼、輕微浮動）；只用首幀生成，不寫末幀也可以
    medium: 主體狀態或位置明顯改變，但構圖不變；必須寫 last_frame，用首尾幀生成
    large: 構圖、景別或主體大幅改變；必須寫 last_frame，考慮拆成兩鏡

  transition:       # 寫在下一鏡的 transition_in
    cut: 直切。在 span.from 的拍點直接換成新畫面，沒有任何效果
    cut_on_action: 直切，前一鏡結尾與這一鏡開頭是同一個動作的前後兩段
    match_cut: 直切，前一鏡結尾與這一鏡開頭有同一個形狀在畫面同一位置
    flash_white: "前一鏡最後 N 幀變成純白 #ffffff（參數 frames），新畫面從純白後的第一幀直接出現，不淡入"
    whiteout: 前一鏡亮度在 in_beats 拍內逐漸升到純白，新畫面再從純白在 out_beats 拍內淡出
    fade_from_black: "從純黑 #000000 在 N 拍（或 frames 幀）內淡入成畫面"
    fade_to_black: 畫面在 N 拍內淡出成純黑，下一鏡從純黑開始
    dissolve: 前後兩個畫面交疊 N 拍，前一鏡淡出的同時新畫面淡入

  post_effect:      # 寫在 post 或 beat_events；不換鏡頭
    flash_frames: 畫面整個變純白 N 幀後回到原畫面（不換鏡）
    glow_pulse: 指定的發光物亮度短暫抬升再回落，畫面其他部分不變；不是全白
    shake: 整個畫面震動 N 幀，位移不超過畫面寬 1%
    chromatic: RGB 色差分離 N 幀
    speed_ramp: 影片速度變化（參數 from/to 倍速）
    freeze: 畫面停在某一幀不動

  screen_x: [screen_left, center_left, center, center_right, screen_right]   # 觀眾看到的左右，五等分
  screen_y: [top, upper, middle, lower, bottom]
  depth: [fg, mg, bg]          # 前景、中景、背景
  facing: [to_camera, three_quarter_left, three_quarter_right, profile_left, profile_right, away]
    # three_quarter_left = 臉朝向畫面左前方；profile_left = 正側面、鼻尖指向畫面左；away = 背對鏡頭

entities:
  # ── 角色 ─────────────────────────────────────────────
  luna:
    kind: character
    name: LUNA
    status: confirmed
    definition: 主角。外觀以 docs/style_bible.md「外觀五項」與 refs/01–06 為準，全片只有這一套服裝。
    refs: [refs/01_full_front.png, refs/02_side.png, refs/03_back.png]
    role: CSFCCA 開發的 AI 救援程式，擁有實體身體  # 方向 A
    notes: 腿環在 char_right 大腿；禁止左右翻轉畫面。

  drone:
    kind: character
    name: ECHO
    status: proposed
    definition: CSFCCA 派給 @luna 的球形無人機夥伴，名叫 ECHO（只是設定名稱，外殼上不出現文字），負責投影、帶路、開門等劇情功能。
    look:
      shape: 正球體，表面有銀灰色細分割線，分成上下兩半
      size: 直徑約 25 cm，約 @luna 頭部的 1.2 倍
      color: "白色外殼 #f4f4f6，分割線 #a8a8b0"
      light: "正面一條橫向的青色光帶 #29d3f5（當作「眼睛」），底部一圈淡青色光暈"
      motion: 懸浮，沒有螺旋槳；移動時平滑滑行；停下時輕微上下浮動，幅度約 2 cm、週期約 2 拍
      position: 全片固定在 @luna 的 char_left 肩旁（s003 起）；執行劇情功能（投影、開門）時可暫時離開，做完回到原位
    not_this:
      - 不是有螺旋槳的四軸無人機
      - 沒有手臂、沒有臉部五官、不說話、外殼上沒有文字或 logo
    plot_functions:      # A02 已接受
      - 投影 @countdown_ring 做倒數
      - 在凍結城市裡帶路
      - 用 @echo_beam 打開門或通道：被照到的門即使在 @silence 範圍內也能開啟，但仍維持灰色（顏色只有 @luna 碰到才會恢復）

  # ── 場景 ─────────────────────────────────────────────
  hq_control:
    kind: place
    name: CSFCCA 控制室
    status: proposed
    definition: CSFCCA 位於地下的圓形控制室，@luna 在這裡被啟動。
    look:
      layout: 圓形房間，直徑約 12 m，天花板高約 5 m；牆面整圈是 @monitor_wall；正中央立著 @pod
      floor: "黑色金屬格柵 #0b0d12，地面有一圈圈細的青色引導燈條 #29d3f5，從牆邊往 @pod 匯聚"
      light: 沒有頂燈；光只來自 @monitor_wall 的螢幕、@pod 內部的白光、地面引導燈條
      palette: "冷藍黑，底色 #07080c"
    not_this:
      - 不是有窗戶的辦公室，看不到外面
      - 沒有操作員或其他人
      - 牆上沒有 CSFCCA 字樣或 logo（字標只在後製疊）

  city:
    kind: place
    name: 城市
    status: proposed
    definition: "@silence 正在吞沒的夜間大都市；全片的主要舞台。"
    variants:
      frozen: 被 @silence 吞沒的版本：完全灰階、所有動態停住（見 @silence）
      restored: 恢復的版本：霓虹與巨幕重新亮起、顏色飽和、雨與人群恢復移動
    look:
      style: 近未來：街上有懸浮車，廣告巨幕是全息看板（同樣無文字）
      layout: 高樓林立的夜間街區，街道兩側有大型廣告巨幕（只放抽象色塊或影像，無文字）
      weather: 下著細雨，地面積水有倒影
    extras: 有路人。路人不算第二角色；不畫清楚的正臉，以背影、側影、遠景為主；frozen 版本的路人是定格的灰色人形（像雕像），不是半透明

  launch_tunnel:
    kind: place
    name: 發射通道
    status: proposed
    definition: 從 @hq_control 天花板通往 @launch_roof 的垂直豎井；@pod 的底座平台載著 @luna 沿它射上地面。
    look:   # 2026-10-23 使用者選「光環豎井」
      shape: 圓形垂直豎井，內徑約 3 m、上下一樣寬，總長約 180 m（地下約 30 m＋大樓內約 150 m）
      bottom: 下端是 @hq_control 的天花板，在 @pod 正上方開一個直徑約 1.6 m 的圓孔；Intro 各鏡都沒拍到天花板
      top: 上端是一片水平頂板（就是 @launch_roof 的樓頂樓板），正中是直徑約 1.6 m 的艙口（外觀見 @launch_roof）
      wall: "黑色霧面金屬 #0b0d12，表面只有細的垂直接縫；沒有導軌"
      travel: 平台以磁浮沿豎井中軸上升，不接觸牆面，平台下方沒有支架或纜繩
      rings: "每隔 6 m 一圈嵌在牆面的青色燈環 #29d3f5，環寬約 10 cm，發光；豎井全長約 30 圈，全部常亮"
      light: 只有燈環與底座平台頂面的白光，沒有其他光源
      palette: "冷藍黑，與 @hq_control 相同的底色 #07080c"
    not_this:
      - 沒有窗戶，牆面不透明，看不到外面
      - 沒有外露管線、黃黑警示條紋、紅色警示燈
      - 牆上沒有文字、數字、樓層標示

  launch_roof:
    kind: place
    name: 發射口樓頂
    status: proposed
    definition: "@hq_control 正上方一棟高樓的樓頂，@launch_tunnel 的出口在這裡；@luna 第一次看見 @city 的地方。"
    look:
      building: 高約 150 m，比四周大樓高，往 @city 中心方向沒有更高的樓擋住視線
      roof: 平頂，約 30 m × 30 m，水泥地面；邊緣一圈高約 1.1 m 的矮牆；4 個方形空調箱（高約 1.5 m）都靠在背向 @city 那一側的矮牆邊，朝 @city 拍時在鏡頭背後、看不到；沒有其他設備
      hatch: "樓頂正中的圓形艙口，直徑約 1.6 m，與地面齊平；由兩片半圓形鋼板組成，接縫是一條朝向 @city 的直線，開啟時兩片各自往接縫的兩側水平滑進地面下（與 @pod 玻璃罩同樣是側滑）；地面上圍著開口有一圈寬約 5 cm 的青色燈環 #29d3f5，常亮，鋼板滑開後仍是完整一圈"
      state: 位在 @silence 範圍內，所以整個樓頂（含艙口）都是 frozen：灰階、雨滴停在半空；艙口燈環仍亮（@silence 不改亮度），但看起來是淺灰白色的發光環。艙口被 @echo_beam 打開後仍是灰色
    not_this:
      - 不是直升機停機坪，地面沒有 H 標記或任何字
      - 艙口不是往上掀的蓋子，也不是光圈式葉片

  street:
    kind: place
    name: 商店街
    status: proposed
    definition: "@launch_roof 那棟大樓前的一條商店街，筆直通往 @city 中心；Verse 全段在這裡。"
    look:
      layout: 筆直的步行商店街，寬約 15 m，兩側是 4–6 層的商店樓；街道正對 @city 中心，從街上往遠處看，街尾約 1.5 km 外是仍為彩色的街區，@signal_tower 的剪影在街尾正上方
      storefront: 一樓是玻璃櫥窗的商店（櫥窗內沒有文字招牌），二到四樓外牆掛著全息看板（只有抽象色塊或影像，無文字）
      ground: 濕的石板路面，散布直徑 0.5–2 m 的水窪
      air: 懸浮車停在街道上方約 6–10 m 處；細雨停在半空
      extras: 街上有零散的定格路人（灰色、像雕像），約每 10 m 一兩位，以背影與側影為主
      state: 位在 @silence 範圍內，全部 frozen；看板與路燈仍亮（@silence 不改亮度），所以街道被中性的灰白光照亮
    not_this:
      - 沒有任何文字招牌、店名、路牌
      - 不是車道，路面上沒有行駛中的車

  balloon_child:
    kind: character
    name: 追氣球的小孩
    status: proposed
    definition: "@street 上一個定格的路人小孩，正在追一顆飛走的 @balloon。路人不算第二角色（project.yaml extras_count_as_character: false）。"
    look:
      body: 約 6 歲，身高約 1.15 m
      outfit: "連帽黃色雨衣 #f2c230（帽子戴著，遮住大半張臉）、深藍色雨靴 #1f2a44"
      pose_frozen: 往街尾方向奔跑中、char_left 腳離地，char_right 手往上伸向前上方的 @balloon
      face: 只拍背影與側影，帽子遮住臉，不畫清楚的五官
      state: frozen 時全身灰階；@luna 碰到後依 @restore_touch 恢復黃色雨衣與動作
    not_this:
      - 不和 @luna 互動、不回頭看她
      - 不是第二主角，之後的段落不再出現

  balloon:
    kind: object
    name: 紅氣球
    status: proposed
    definition: "@balloon_child 追著的一顆氦氣球，定格在半空。"
    look:
      shape: 圓形橡膠氦氣球，下方有一條細繩
      size: 直徑約 35 cm；繩長約 0.6 m
      color: "紅色 #d8323a，表面有柔和高光；繩子白色"
      position_frozen: 在 @balloon_child 伸出的手前上方約 0.3 m（往街尾方向），氣球底部離地約 1.9 m，繩尾垂到離地約 1.3 m，剛好在小孩指尖前方
      state: frozen 時灰階、停在半空；恢復時變回紅色並以約每秒 0.5 m 往上飄
    not_this:
      - 氣球上沒有圖案或文字
      - 不是心形或其他造型氣球

  signal_tower:
    kind: place
    name: 訊號塔
    status: proposed
    definition: "@city 中央最高的廣播塔，全頻廣播從這裡發出。"
    look:   # 2026-10-23 先定剪影；材質、燈光、內部在寫 Chorus 1 前再問
      silhouette: 細長的直立塔身，中上段（約塔高 2/3 處）有一個圓盤形觀景台，寬約塔身的 4 倍，觀景台以上是一根細長天線（約塔高 1/4）；塔高約周圍大樓的 2 倍
      location: "@city 中心，距 @launch_roof 約 3 km"
      state_at_hook: Hook 時仍在彩色區內，灰色邊界正往它推進
    not_this:
      - 不是格子鋼構的鐵塔
      - 不是頂端有大圓環的塔

  # ── 物件 ─────────────────────────────────────────────
  pod:
    kind: object
    name: 啟動艙
    status: proposed
    definition: 立在 @hq_control 正中央、@luna 啟動前站在裡面的直立艙。
    look:
      shape: 直立的膠囊形；下段是白色金屬底座，上段是透明弧形玻璃罩
      size: 高約 2.2 m、直徑約 1 m；@luna 站在裡面時頭頂離罩頂約 30 cm
      color: "底座白 #f4f4f6；玻璃無色透明，邊緣有淡青色反光"
      light: "底座頂面整片發出柔和白光 #e8f4ff，由下往上照亮 @luna"
      opening: 玻璃罩分成左右兩半，接縫在艙的左右兩側（正面看不到接縫）；開啟時向兩側滑開（不是往上掀）
      platform: 底座頂端是一片圓形平台（直徑約 1 m、厚約 10 cm，頂面就是發白光的那一面），可以和底座下段分離，沿 @launch_tunnel 往上射；平台升走後玻璃罩兩半與底座下段留在 @hq_control
    not_this:
      - 不是躺著的冷凍艙
      - 玻璃罩內沒有液體或霧氣

  monitor_wall:
    kind: object
    name: 監視牆
    status: proposed
    definition: 環繞 @hq_control 一整圈的螢幕牆，顯示 @city 各處的即時畫面。
    look:
      shape: 約 40 面 16:9 螢幕，排成 3 層，沿圓形牆面彎曲
      size: 每面螢幕寬約 1.6 m
      content: 每面螢幕顯示 @city 的一個角落；@silence 擴散到哪裡，那面螢幕的畫面就變成 frozen 版本。正中欄中間層是主螢幕，只顯示 @signal_wave。城市畫面約 7 張輪流使用，每張有彩色與 frozen 兩版
      off_state: 關機時是純黑的玻璃面，有淡淡反光
    not_this:
      - 螢幕上沒有文字、數字、UI、地圖標記

  # ── 特效 ─────────────────────────────────────────────
  signal_wave:
    kind: vfx
    name: 訊號波形
    status: proposed
    definition: "@monitor_wall 正中央那面主螢幕上出現的一條橫向波形，代表 CSFCCA 收到求救訊號。"
    look:
      shape: 一條水平橫貫螢幕的細波形線；平時是幾乎平的直線，訊號進來時出現單一向上的窄尖峰
      size: 線寬約為所在螢幕高的 0.5%；波峰高度最多到螢幕高的 1/3
      color: "青色 #29d3f5，線本身發光，周圍有約 3 倍線寬的柔和光暈"
    not_this:
      - 不是一般的「光線」或照明
      - 沒有座標軸、刻度或數字

  countdown_ring:
    kind: vfx
    name: 倒數光環
    status: proposed
    definition: "@drone 投影在 @pod 玻璃罩外的一個圓形光環，用來表示出擊倒數。"
    look:
      shape: 一個平面圓環，垂直立在 @pod 玻璃罩外表面正前方 50 cm，環面朝向鏡頭，圓心與 @luna 雙眼同高
      size: 外徑約 0.6 m，環寬約 4 cm（各鏡在畫面中的大小以該鏡 subjects 的 size 為準）
      segments: 環分成 3 段等長的弧，弧與弧之間有約 10° 的空隙；以觀眾看到的畫面正右為 0°、逆時針為正，3 段弧的中心分別在 60°（右上）、180°（左）、300°（右下）
      color: "青色 #29d3f5，發光；熄滅的弧變成深灰 #2a2f38、不發光"
      count_rule: 每數一個數字熄滅一段弧，順序 60° → 180° → 300°（逆時針）；熄滅＝2 幀內淡成深灰，深灰弧留在畫面上
      realize: 全部由後製合成，影片模型不畫光環
    not_this:
      - 光環上沒有數字；後製也先不疊數字字卡（project.yaml decisions.countdown_numbers）
      - "@drone 與光環之間沒有可見的投影光束"

  echo_beam:
    kind: vfx
    name: ECHO 光束
    status: proposed
    definition: "@drone 從正面光帶射出的開門光束；照到門、艙口或通道的開關處時，那扇門會開啟（見 @drone 的劇情功能）。"
    look:
      shape: 一條筆直的細光束，從 @drone 光帶正中射到目標，粗細一致
      size: 寬約 3 cm
      color: "青色 #29d3f5，光束本身發光，周圍有約 2 倍寬的柔和光暈；照到的地方出現一個直徑約 20 cm 的青色光點"
      timing: 每次約 6 幀：1 幀內出現、維持 4 幀、1 幀內消失
      realize: 由後製合成
    not_this:
      - 不是雷射武器，不會燒穿或炸開東西
      - 不會恢復顏色（恢復顏色是 @restore_touch，只有 @luna 會）

  tower_hologram:
    kind: vfx
    name: 全息訊號塔
    status: proposed
    definition: "@drone 投影在 @luna 面前的一個小型 @signal_tower 全息模型，用來告訴她要去哪裡。"
    look:
      shape: "@signal_tower 的縮小模型：細長塔身、中上段圓盤觀景台、頂端天線，比例與 glossary 的剪影相同"
      size: 高約 25 cm，懸在 @drone 光帶正前方約 30 cm，底部與 @luna 下巴同高
      color: "半透明青色 #29d3f5，輪廓線較亮，表面有細的水平掃描線往上移動"
      motion: 出現時 4 幀內由下往上掃出；存在時不自轉，只有表面掃描線持續往上移動；消失時 4 幀內由上往下收掉
      realize: 由後製合成
    not_this:
      - 沒有文字、數字、地圖或箭頭
      - "@drone 與全息塔之間沒有可見的投影光束"

  silence:
    kind: state
    name: 靜默
    status: proposed
    definition: 吞沒世界的現象。被吞沒的區域顏色、聲音、動態全部停止，變成灰階的定格畫面。沒有形體或核心。
    look:
      color: 飽和度降到 0（純灰階），亮度不變
      motion: 區域內的一切停在半空：雨滴、水花、煙、旗子、行人都靜止
      boundary: 被吞沒與未被吞沒的區域之間，是一條約 1 m 寬的漸層帶；顏色在帶內由飽和逐漸變灰；帶內有細小、靜止的灰色顆粒
      spread: 邊界向外推進，速度約每秒 30 m（2026-10-23 使用者改，原為每秒 1 m）；推進時沒有光、沒有聲音特效。這個速度只用來決定一鏡之內看得到多少推進，不用來推算全片的地理與時間
    not_this:
      - 不是黑霧、黑洞、漩渦或怪物
      - 不是冰凍：沒有冰晶與白霜

  restore_touch:
    kind: state
    name: 觸碰恢復
    status: proposed
    definition: "@luna 身體碰到的 frozen 物體短暫恢復原本的顏色與動態，之後又被 @silence 蓋回灰色定格。只有 @luna 有這個能力（@drone 與平台沒有）。Hook 是小小的預告（雨滴），Verse 她才真正發現這個能力。"
    look:
      restore: 被碰到的物體整個恢復（一整個水窪、一整顆氣球連繩子、一整個人），在 2 幀內恢復原色，動作從停住的地方接著進行；恢復時沒有發光、光暈或粒子特效
      duration: 依鏡頭指定（Hook 的雨滴約 12 幀）；duration 是恢復維持的時間，不含之後 6 幀的退回
      return: 時間到時顏色在 6 幀內退回灰階、動作停在當下的位置
      rain_drop: 恢復的雨滴是透明水珠，映出附近光源的顏色（平台白光、@drone 的青色光帶），會往下落；退回灰色時停在半空。遠景裡水珠太小，後製把恢復中的水珠亮度提高到約 2 倍，讓它們看得見
    not_this:
      - 不是 @luna 身上發出的光或衝擊波（衝擊波是 Chorus 1 的廣播）
      - 恢復範圍只有她身體直接碰到的東西，不會向外擴散
